name: Publish to npm

# Publishes when a GitHub Release is published.
#
# Requires an npm automation token in the NPM_TOKEN repository secret. Without
# it `npm publish` fails with ENEEDAUTH -- which is exactly what happened to
# v0.4.3: the tag and the GitHub Release existed, the package did not, and the
# apps that consume it from the registry went on installing the old version.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
